# Render Blueprint: creates the API and its PostgreSQL database together.
# Put this file in the ROOT of your git repo (next to the backend and frontend folders).
databases:
  - name: warehouse-db
    databaseName: warehouse
    user: warehouse
    plan: free

services:
  - type: web
    name: warehouse-tracker-api
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: go build -o app .
    startCommand: ./app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false   # you enter this in the Render dashboard (your Vercel URL)
