# Render Blueprint: creates the Go API and its PostgreSQL database together.
# Keep this file in the ROOT of your git repo (next to the backend and frontend folders).
databases:
  - name: warehouse-db
    databaseName: warehouse
    user: warehouse
    plan: free
    ipAllowList: []   # only Render services in your account can connect (no outside access)

services:
  - type: web
    name: warehouse-tracker-api
    runtime: go
    rootDir: backend
    plan: free
    # `go mod tidy` fetches pgx and creates go.sum on the build server.
    buildCommand: go mod tidy && go build -o app .
    startCommand: ./app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false   # you enter this in the Render dashboard (your frontend URL)
